      - name: "00 Shopping analytics service (Scala)"
        if: steps.pr_scope.outputs.skip_build != 'true'
        run: scripts/sbt-test.sh docs-source/docs/modules/microservices-tutorial/examples/00-shopping-analytics-service-scala

